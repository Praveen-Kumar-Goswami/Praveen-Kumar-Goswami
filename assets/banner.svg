<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#a371f7" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.8" />
    </linearGradient>

    <!-- Title Shimmer Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#a371f7;#38bdf8;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#a371f7;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#34d399;#58a6ff;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Ambient Glowing Orbs -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Lights & Lines -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .font-mono {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', 'Courier New', monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      }

      /* Pulse Grid Effect */
      .grid-pattern {
        opacity: 0.15;
        animation: gridPulse 6s ease-in-out infinite alternate;
      }
      @keyframes gridPulse {
        0% { opacity: 0.08; }
        100% { opacity: 0.22; }
      }

      /* Glowing Beacon Wave */
      .beacon-ripple {
        transform-origin: 55px 45px;
        animation: ripple 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      @keyframes ripple {
        0% { transform: scale(0.8); opacity: 1; }
        100% { transform: scale(3.2); opacity: 0; }
      }

      /* Floating Ambient Orbs */
      .orb-1 {
        animation: floatOrbA 10s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrbB 12s ease-in-out infinite alternate;
      }
      .orb-3 {
        animation: floatOrbC 8s ease-in-out infinite alternate;
      }
      @keyframes floatOrbA {
        0% { transform: translate(0, 0); }
        100% { transform: translate(60px, 40px); }
      }
      @keyframes floatOrbB {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-50px, -30px); }
      }
      @keyframes floatOrbC {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, -45px); }
      }

      /* Shimmering Border Accent */
      .border-line {
        stroke-dasharray: 200 400;
        animation: dashMove 14s linear infinite;
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1200; }
      }

      /* Code Typing Cursor Blink */
      .blink-cursor {
        animation: cursorBlink 1s infinite steps(2, start);
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="20" fill="url(#bgGradient)" />

  <!-- Ambient Light Orbs (Floating) -->
  <circle cx="200" cy="120" r="220" fill="url(#orbGlow1)" class="orb-1" filter="url(#glowFilter)" />
  <circle cx="1020" cy="180" r="260" fill="url(#orbGlow2)" class="orb-2" filter="url(#glowFilter)" />
  <circle cx="600" cy="360" r="180" fill="url(#orbGlow3)" class="orb-3" filter="url(#glowFilter)" />

  <!-- High-Tech Isometric Grid -->
  <g class="grid-pattern">
    <line x1="80" y1="0" x2="80" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="180" y1="0" x2="180" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="280" y1="0" x2="280" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="380" y1="0" x2="380" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="480" y1="0" x2="480" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="580" y1="0" x2="580" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="680" y1="0" x2="680" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="780" y1="0" x2="780" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="880" y1="0" x2="880" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="980" y1="0" x2="980" y2="440" stroke="#30363d" stroke-width="1" />
    <line x1="1080" y1="0" x2="1080" y2="440" stroke="#30363d" stroke-width="1" />

    <line x1="0" y1="80" x2="1200" y2="80" stroke="#30363d" stroke-width="1" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#30363d" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#30363d" stroke-width="1" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#30363d" stroke-width="1" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Glowing Outer Frame -->
  <rect x="2" y="2" width="1196" height="436" rx="19" fill="none" stroke="#21262d" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="436" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2" class="border-line" filter="url(#softGlow)" />

  <!-- Corner Brackets -->
  <path d="M 24 50 L 24 24 L 50 24" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 1176 50 L 1176 24 L 1150 24" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 24 390 L 24 416 L 50 416" fill="none" stroke="#a371f7" stroke-width="3" stroke-linecap="round" />
  <path d="M 1176 390 L 1176 416 L 1150 416" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" />

  <!-- TOP BAR: Status Beacon & Quick Metas -->
  <g transform="translate(48, 32)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <circle cx="20" cy="17" r="6" stroke="#3fb950" stroke-width="2" fill="none" class="beacon-ripple" />
    <circle cx="20" cy="17" r="4.5" fill="#3fb950" filter="url(#softGlow)" />
    <text x="36" y="22" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">ONLINE</text>
    <text x="96" y="22" fill="#8b949e" font-size="12" font-weight="500" class="font-mono">// ML &amp; VISION RESEARCH</text>
  </g>

  <!-- TOP RIGHT: Hackathon / Specialty Pill -->
  <g transform="translate(840, 32)">
    <rect x="0" y="0" width="312" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
    <path d="M 24 10 L 32 10 L 32 15 C 32 19 29 22 25 22 C 21 22 18 19 18 15 L 18 10 Z" fill="none" stroke="#f59e0b" stroke-width="1.8" />
    <path d="M 18 12 L 14 12 C 13 12 12 13 12 14 C 12 16 13 18 16 18 L 18 18" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 32 12 L 36 12 C 37 12 38 13 38 14 C 38 16 37 18 34 18 L 32 18" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="25" y1="22" x2="25" y2="25" stroke="#f59e0b" stroke-width="1.8" />
    <line x1="20" y1="25" x2="30" y2="25" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
    <text x="46" y="22" fill="#e6edf3" font-size="12" font-weight="600" class="font-mono">SIH '26 DEFENSE AI FINALIST</text>
  </g>

  <!-- MAIN HERO SECTION -->
  <g transform="translate(64, 110)">
    <text x="0" y="24" fill="#a371f7" font-size="14" font-weight="700" letter-spacing="3" class="font-mono">
      &gt; MACHINE_LEARNING // DEEP_LEARNING // COMPUTER_VISION
    </text>

    <!-- Shimmering Developer Name -->
    <text x="0" y="80" fill="url(#titleGrad)" font-size="52" font-weight="900" letter-spacing="-0.5" class="font-sans" filter="url(#softGlow)">
      Praveen Kumar Goswami
    </text>

    <!-- Primary Title Tagline -->
    <text x="0" y="122" fill="#e6edf3" font-size="22" font-weight="600" class="font-sans">
      Machine Learning &amp; Deep Learning Engineer <tspan fill="#58a6ff">•</tspan> Vision AI <tspan fill="#a371f7">•</tspan> Full-Stack Systems
    </text>

    <!-- Terminal Code Block Preview -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="710" height="58" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
      <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
      <circle cx="36" cy="18" r="4.5" fill="#ffbd2e" />
      <circle cx="52" cy="18" r="4.5" fill="#27c93f" />
      <text x="74" y="22" fill="#8b949e" font-size="13" class="font-mono">python3 -m torch.inference --vision</text>
      
      <text x="20" y="44" fill="#58a6ff" font-size="13.5" font-weight="600" class="font-mono">&gt;&gt;&gt; model =</text>
      <text x="120" y="44" fill="#e6edf3" font-size="13.5" class="font-mono">NeuralVision(layers=[</text>
      <text x="280" y="44" fill="#3fb950" font-size="13.5" class="font-mono">"CNN"</text>
      <text x="325" y="44" fill="#e6edf3" font-size="13.5" class="font-mono">, </text>
      <text x="340" y="44" fill="#c084fc" font-size="13.5" class="font-mono">"MediaPipeMesh"</text>
      <text x="460" y="44" fill="#e6edf3" font-size="13.5" class="font-mono">, </text>
      <text x="475" y="44" fill="#38bdf8" font-size="13.5" class="font-mono">"YOLOv8"</text>
      <text x="545" y="44" fill="#e6edf3" font-size="13.5" class="font-mono">], latency=</text>
      <text x="635" y="44" fill="#f43f5e" font-size="13.5" class="font-mono">"&lt;100ms"</text>
      <text x="690" y="44" fill="#e6edf3" font-size="13.5" class="font-mono">)</text>

      <rect x="702" y="32" width="6" height="15" fill="#58a6ff" class="blink-cursor" />
    </g>

    <!-- Interactive Tech Pills (Bottom Row) -->
    <g transform="translate(0, 235)">
      <!-- PyTorch & TensorFlow Pill -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#ee4c2c" />
        <text x="28" y="22" fill="#c9d1d9" font-size="12" font-weight="600" class="font-mono">PyTorch / TF</text>
      </g>

      <!-- MediaPipe & OpenCV Pill -->
      <g transform="translate(155, 0)">
        <rect width="160" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#3fb950" />
        <text x="28" y="22" fill="#c9d1d9" font-size="12" font-weight="600" class="font-mono">MediaPipe &amp; CV</text>
      </g>

      <!-- Scikit-Learn & Data Pill -->
      <g transform="translate(325, 0)">
        <rect width="150" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#f59e0b" />
        <text x="28" y="22" fill="#c9d1d9" font-size="12" font-weight="600" class="font-mono">Scikit-Learn</text>
      </g>

      <!-- Python 3.12 Pill -->
      <g transform="translate(485, 0)">
        <rect width="115" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#38bdf8" />
        <text x="28" y="22" fill="#c9d1d9" font-size="12" font-weight="600" class="font-mono">Python 3.12</text>
      </g>

      <!-- TypeScript & Next.js Pill -->
      <g transform="translate(610, 0)">
        <rect width="140" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#58a6ff" />
        <text x="28" y="22" fill="#c9d1d9" font-size="12" font-weight="600" class="font-mono">TS &amp; Next.js</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Neural Vision Cyber Core -->
  <g transform="translate(870, 110)">
    <!-- Outer Floating Neon Ring -->
    <ellipse cx="140" cy="130" rx="130" ry="60" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" transform="rotate(-25 140 130)" stroke-dasharray="16 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="-25 140 130" to="335 140 130" dur="24s" repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="140" cy="130" rx="100" ry="40" fill="none" stroke="#58a6ff" stroke-width="1.8" transform="rotate(35 140 130)" stroke-dasharray="10 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="35 140 130" to="-325 140 130" dur="18s" repeatCount="indefinite" />
    </ellipse>

    <!-- Center Neural Core Hexagon -->
    <g transform="translate(140, 130)">
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#161b22" stroke="url(#titleGrad)" stroke-width="3" filter="url(#softGlow)" />
      
      <!-- Pulsing Neural Iris -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="7" fill="#c084fc" filter="url(#glowFilter)">
        <animate attributeName="r" values="6;8.5;6" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <!-- Neural Rays -->
      <line x1="-26" y1="0" x2="-20" y2="0" stroke="#38bdf8" stroke-width="2" />
      <line x1="20" y1="0" x2="26" y2="0" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="-26" x2="0" y2="-20" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="20" x2="0" y2="26" stroke="#38bdf8" stroke-width="2" />
    </g>

    <g transform="translate(30, 230)">
      <rect width="220" height="28" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="110" y="18" fill="#a371f7" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">NEURAL VISION // &lt;100MS</text>
    </g>
  </g>
</svg>
