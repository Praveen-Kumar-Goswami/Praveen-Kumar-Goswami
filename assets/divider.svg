<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 32" width="100%" height="32">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a371f7" stop-opacity="1" />
      <stop offset="75%" stop-color="#3fb950" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <line x1="50" y1="16" x2="950" y2="16" stroke="url(#divGrad)" stroke-width="2" filter="url(#divGlow)" />
  <circle cx="500" cy="16" r="5" fill="#a371f7" filter="url(#divGlow)">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="16" r="2.5" fill="#ffffff" />
</svg>
