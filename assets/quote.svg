<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="quoteBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <filter id="quoteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .quote-mono {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
      }
      .quote-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-style: italic;
      }
      .quote-border-pulse {
        animation: borderPulse 8s ease-in-out infinite alternate;
      }
      @keyframes borderPulse {
        0% { stroke-opacity: 0.4; }
        100% { stroke-opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="140" rx="14" fill="url(#quoteBg)" />
  <rect x="2" y="2" width="996" height="136" rx="12" fill="none" stroke="url(#quoteBorder)" stroke-width="2" class="quote-border-pulse" filter="url(#quoteGlow)" />

  <!-- Quote Mark Icon -->
  <text x="40" y="70" fill="#58a6ff" font-size="64" font-weight="900" opacity="0.3" class="quote-mono">“</text>

  <!-- Quote Statement -->
  <g transform="translate(85, 45)">
    <text x="0" y="10" fill="#e6edf3" font-size="18" font-weight="500" class="quote-text">
      Technology reaches its highest purpose when it creates freedom, accessibility,
    </text>
    <text x="0" y="38" fill="#e6edf3" font-size="18" font-weight="500" class="quote-text">
      and independence for those who need it most.
    </text>
    <text x="0" y="68" fill="#8b949e" font-size="13" font-weight="600" class="quote-mono">
      — <tspan fill="#58a6ff">Praveen Kumar Goswami</tspan> // Core Engineering Philosophy
    </text>
  </g>
</svg>
